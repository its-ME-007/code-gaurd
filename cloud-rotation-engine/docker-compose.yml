version: '3.8'

services:
  cloud-rotation-engine:
    build: .
    container_name: cloud-rotation-engine
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./data:/app/data
      - ./cloud-rotation-engine:/app/cloud-rotation-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cloud-rotation-network

networks:
  cloud-rotation-network:
    driver: bridge

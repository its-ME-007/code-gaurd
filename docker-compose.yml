version: '3.8'

services:
  cloud-rotation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-rotation-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./cloud-rotation-engine/data:/app/data
      - ./cloud-rotation-engine:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cloud-rotation-network

networks:
  cloud-rotation-network:
    driver: bridge